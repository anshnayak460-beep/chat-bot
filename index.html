
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">
  <title>Nova AI Chatbot</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d1c;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #10182b;
      border: 1px solid #293451;
      border-radius: 22px;
      box-shadow: 0 15px 60px #0005;
    }

    header {
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #293451;
    }

    .logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 25px;
      background: linear-gradient(135deg, #7657ff, #10c7e8);
    }

    .brand { flex: 1; }
    h1 { font-size: 19px; margin: 0 0 5px; }
    .status { color: #6ee7b7; font-size: 12px; }

    button { font: inherit; cursor: pointer; }

    .new-chat, .quick button {
      padding: 10px 12px;
      color: #e3e8ff;
      background: #1a2540;
      border: 1px solid #354568;
      border-radius: 11px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .welcome {
      margin: auto 0;
      text-align: center;
      color: #afbdd7;
      line-height: 1.8;
    }

    .welcome h2 { color: white; font-size: 27px; }

    .quick {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .quick button:hover, .new-chat:hover {
      border-color: #8275ff;
    }

    .message {
      max-width: 92%;
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #293858;
    }

    .user .avatar { background: #5546ca; }

    .bubble {
      padding: 12px 15px;
      border-radius: 4px 15px 15px;
      background: #1b2942;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: linear-gradient(135deg, #5546ca, #344ca6);
      border-radius: 15px 4px 15px 15px;
    }

    #typing {
      padding: 0 22px 12px;
      color: #aab8d2;
      font-size: 13px;
    }

    .input-area {
      padding: 14px;
      border-top: 1px solid #293451;
      background: #111a2e;
    }

    form { display: flex; gap: 10px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      color: white;
      background: #0b1325;
      border: 1px solid #354568;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus { border-color: #8275ff; }

    #send {
      padding: 0 18px;
      color: white;
      border: 0;
      border-radius: 12px;
      font-weight: bold;
      background: linear-gradient(135deg, #6557ff, #278bdb);
    }

    #send:disabled { opacity: .5; cursor: wait; }

    .note {
      margin: 10px 0 0;
      text-align: center;
      color: #7786a5;
      font-size: 11px;
    }

    @media(max-width: 600px) {
      body { padding: 0; }
      .app {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
      }
      header { padding: 12px; }
      #chat { padding: 13px 9px; }
      .message { max-width: 97%; }
      .bubble { padding: 10px; font-size: 14px; }
      .input-area { padding: 10px; }
      .new-chat { padding: 8px; font-size: 12px; }
      #send { padding: 0 13px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">✦</div>
      <div class="brand">
        <h1>Nova AI</h1>
        <div class="status">● AI Assistant</div>
      </div>
      <button class="new-chat" id="newChat" type="button">
        + New Chat
      </button>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>Hello! 👋</h2>
        Main Nova AI hoon. Aaj main tumhari kya help karun?
        <div class="quick">
          <button type="button" data-q="AI kya hai?">🤖 AI kya hai?</button>
          <button type="button" data-q="Mujhe Python sikhao">🐍 Learn Python</button>
          <button type="button" data-q="Ek website kaise banayein?">💻 Website</button>
        </div>
      </div>
    </section>

    <div id="typing" hidden>Nova AI soch raha hai...</div>

    <div class="input-area">
      <form id="form">
        <input
          id="prompt"
          maxlength="4000"
          placeholder="Apna sawaal likho..."
          autocomplete="off"
          aria-label="Apna sawaal likho"
          required
        >
        <button id="send" type="submit">Send ➤</button>
      </form>
      <p class="note">AI ke answers ko zaroorat ke hisaab se verify karein.</p>
    </div>
  </main>

  <script>
    // IMPORTANT: Apne deployed Cloudflare Worker ka URL yahan daalo.
    // Example: https://nova-ai-backend.yourname.workers.dev
    const API_URL =
      "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const typing = document.getElementById("typing");

    let history = [];
    let busy = false;

    function addMessage(text, role) {
      document.getElementById("welcome")?.remove();

      const row = document.createElement("div");
      row.className =
        "message " + (role === "user" ? "user" : "bot");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      // Safe text rendering; user content is not interpreted as HTML.
      bubble.textContent = text;

      row.append(avatar, bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    async function askAI(question) {
      if (busy || !question.trim()) return;

      if (API_URL.includes("1f36afd2457c880ac5a4b852b87ea144")) {
        addMessage(
          "Pehle index.html mein API_URL ko apne deployed Cloudflare Worker URL se replace karo.",
          "assistant"
        );
        return;
      }

      busy = true;
      sendButton.disabled = true;
      promptInput.disabled = true;

      addMessage(question, "user");
      typing.hidden = false;

      const nextHistory = [
        ...history,
        { role: "user", content: question }
      ].slice(-20);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: nextHistory })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed.");
        }

        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("AI ka jawab nahi mila.");
        }

        history = [
          ...nextHistory,
          { role: "assistant", content: data.reply }
        ].slice(-20);

        addMessage(data.reply, "assistant");

      } catch (error) {
        addMessage(
          "AI se connect nahi ho paaya.\n" +
          error.message +
          "\n\nWorker URL, API key aur backend settings check karo.",
          "assistant"
        );
      } finally {
        typing.hidden = true;
        busy = false;
        sendButton.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const question = promptInput.value.trim();
      if (!question || busy) return;

      promptInput.value = "";
      askAI(question);
    });

    document.querySelectorAll("[data-q]").forEach((button) => {
      button.addEventListener("click", () => {
        askAI(button.dataset.q);
      });
    });

    document.getElementById("newChat").addEventListener("click", () => {
      if (busy) return;

      history = [];
      chat.replaceChildren();

      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";
      welcome.textContent =
        "Nayi chat shuru ho gayi! Apna sawaal likho.";

      chat.appendChild(welcome);
      promptInput.focus();
    });
  </script>
</body>
</html>
